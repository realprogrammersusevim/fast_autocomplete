[package]
name = "fast_autocomplete"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
anyhow = "1.0.102"
dashmap = "6.1.0"
env_logger = "0.11.10"
fuzzy-matcher = "0.3.7"
libc = "0.2.186"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
# Lint groups — priority -1 so individual overrides below take precedence
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
perf     = { level = "warn", priority = -1 }

# Suppressions
# This is a private CLI tool, not a published crate
cargo_common_metadata = "allow"
# Callers in a binary always use return values; #[must_use] would be noise
must_use_candidate = "allow"
# Doc comments on internal error/panic paths are noise for a private tool
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Conventional in test modules
wildcard_imports = "allow"
# match is clearer than map_or_else for multi-line arms
option_if_let_else = "allow"
# fuzzy_score is i64→f64; slight precision loss is intentional in scoring
cast_precision_loss = "allow"
